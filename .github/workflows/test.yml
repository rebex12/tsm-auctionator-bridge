name: TSM Auctionator Bridge - test and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Test bridge and WoW entry point
        run: lua5.1 tests/run.lua
      - name: Package addon
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: TSMAuctionatorBridge
          path: |
            dist/*-forever.zip
            dist/release.json
          if-no-files-found: error
