name: Publish Forever release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: forever-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Test bridge and UI
        run: lua5.1 tests/run.lua
      - name: Package Forever addon and WowUp metadata
        run: python3 scripts/package.py
      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          addon_version=$(jq -r '.releases[0].version' dist/release.json)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$addon_version" ]]; then
            echo "The tag must match the version in the addon TOC."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: forever-release
          path: |
            dist/*-forever.zip
            dist/release.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forever-release
          path: dist
      - name: Publish ZIP and release.json to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          addon_version=$(jq -r '.releases[0].version' dist/release.json)
          addon_filename=$(jq -r '.releases[0].filename' dist/release.json)
          addon_tag="v$addon_version"
          if existing_assets=$(gh release view "$addon_tag" --json assets --jq '.assets[].name' 2>/dev/null); then
            for asset_path in "dist/$addon_filename" dist/release.json; do
              asset_name=$(basename "$asset_path")
              if ! grep -Fqx -- "$asset_name" <<< "$existing_assets"; then
                gh release upload "$addon_tag" "$asset_path"
              fi
            done
            echo "Release $addon_tag contains the WowUp assets; existing files were preserved."
            exit 0
          fi
          release_options=()
          if [[ "$addon_version" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$addon_tag" "dist/$addon_filename" dist/release.json \
            --target "$GITHUB_SHA" --title "TSM Auctionator Bridge $addon_version" \
            --notes 'WoW: Forever package with WowUp metadata. Alpha builds still require in-game validation.' \
            "${release_options[@]}"
